name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: stable
          cache: true

      - name: Set up Rust (needed by the audiotags plugin)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Generate Android scaffolding
        run: |
          cp -r android /tmp/android_custom
          flutter create --org com.mounsokdara --project-name musicplayer --platforms android .
          cp -rf /tmp/android_custom/. android/
          cat >> android/build.gradle.kts <<'KTS'

          subprojects {
              plugins.withId("com.android.library") {
                  val ext = extensions.getByName("android") as com.android.build.gradle.LibraryExtension
                  if (ext.namespace == null) {
                      val mf = file("src/main/AndroidManifest.xml")
                      val pkg = if (mf.exists()) Regex("package=\"([^\"]+)\"").find(mf.readText())?.groupValues?.get(1) else null
                      ext.namespace = pkg ?: group.toString()
                  }
              }
          }

          // Plugins like on_audio_query_android hardcode Java 1.8 while Kotlin
          // compiles at 17 -> "Inconsistent JVM-target compatibility". Force all
          // Android library modules to Java 17 so both compilers agree.
          subprojects {
              val alignJavaTarget = {
                  plugins.withId("com.android.library") {
                      val ext = extensions.getByName("android") as com.android.build.gradle.LibraryExtension
                      ext.compileOptions {
                          sourceCompatibility = JavaVersion.VERSION_17
                          targetCompatibility = JavaVersion.VERSION_17
                      }
                  }
              }
              // :app is already evaluated (evaluationDependsOn), so guard afterEvaluate.
              if (state.executed) alignJavaTarget() else afterEvaluate { alignJavaTarget() }
          }

          subprojects {
              tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                  kotlinOptions {
                      jvmTarget = "17"
                  }
              }
          }
          KTS

          echo "kotlin.jvm.target.validation.mode=warning" >> android/gradle.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (informational, never fails the build)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos || true

      - name: Build release APK (always v1.0.0)
        run: flutter build apk --release --build-name=1.0.0 --build-number=1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: music-player-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Music Player v1.0.0
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
