name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: stable
          cache: true

      - name: Generate Android scaffolding
        run: |
          cp -r android /tmp/android_custom
          flutter create --org com.mounsokdara --project-name musicplayer --platforms android .
          cp -rf /tmp/android_custom/. android/
          cat >> android/build.gradle.kts <<'KTS'

subprojects {
    plugins.withId("com.android.library") {
        val ext = extensions.getByName("android") as com.android.build.gradle.LibraryExtension
        if (ext.namespace == null) {
            val mf = file("src/main/AndroidManifest.xml")
            val pkg = if (mf.exists()) Regex("package=\"([^\"]+)\"").find(mf.readText())?.groupValues?.get(1) else null
            ext.namespace = pkg ?: group.toString()
        }
    }
}
KTS

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: music-player-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Music Player v1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
