name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: stable
          cache: true

      - name: Generate Android scaffolding
        run: |
          cp -r android /tmp/android_custom
          flutter create --org com.mounsokdara --project-name musicplayer --platforms android .
          cp -rf /tmp/android_custom/. android/

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: music-player-apk
          path: build/app/outputs/flutter-apk/app-release.apk
